services:
  - type: web
    name: laptop-shopping-agent
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn shopping_agent.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: APP_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
