services:
  - type: web
    name: laptop-shopping-agent
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn shopping_agent.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_MODEL
        value: qwen-plus
      - key: BAILIAN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: APP_ENV
        value: production
      - key: BAILIAN_API_KEY
        sync: false
